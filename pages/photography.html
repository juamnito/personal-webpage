<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photography | Juan Armando Parra Flores</title>
    <link rel="icon" type="image/svg+xml" href="../img/favicon-torus.svg">
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <nav class="nav top-nav sticky-top-nav">
        <ul>
            <li><a href="../index.html#presentation">Home</a></li>
            <li><a href="../research.html">Research</a></li>
            <li><a href="photography.html">Photography</a></li>
        </ul>
    </nav>

    <main class="gallery-page">
        <header class="gallery-header">
            <h2>Photography</h2>
            <p>Selected moments from everyday life and travel.</p>
        </header>

        <section class="photo-grid" id="photo-grid" aria-label="Photo gallery"></section>
    </main>

    <div class="lightbox" id="lightbox" aria-hidden="true">
        <div class="lightbox-content">
            <button class="lightbox-close" aria-label="Close image">×</button>
            <img id="lightbox-image" src="" alt="Expanded photography">
        </div>
    </div>

    <script>
        const grid = document.getElementById('photo-grid');
        const lightbox = document.getElementById('lightbox');
        const lightboxImage = document.getElementById('lightbox-image');
        const closeButton = document.querySelector('.lightbox-close');

        function openLightbox(src, alt) {
            lightboxImage.src = src;
            lightboxImage.alt = alt;
            lightbox.classList.add('is-open');
            lightbox.setAttribute('aria-hidden', 'false');
        }

        function closeLightbox() {
            lightbox.classList.remove('is-open');
            lightbox.setAttribute('aria-hidden', 'true');
            lightboxImage.src = '';
        }

        fetch('../img/fotos/photos.json')
            .then((response) => {
                if (!response.ok) {
                    throw new Error('Could not load photo list');
                }
                return response.json();
            })
            .then((photos) => {
                photos.forEach((file, index) => {
                    const figure = document.createElement('figure');
                    figure.className = 'photo-card';

                    const img = document.createElement('img');
                    const src = `../img/fotos/${file}`;
                    img.src = src;
                    img.alt = `Photography ${index + 1}`;
                    img.loading = 'lazy';

                    figure.addEventListener('click', () => {
                        openLightbox(src, img.alt);
                    });

                    const caption = document.createElement('figcaption');
                    caption.textContent = `Photo ${index + 1}`;

                    figure.appendChild(img);
                    figure.appendChild(caption);
                    grid.appendChild(figure);
                });
            })
            .catch((error) => {
                console.error(error);
                grid.innerHTML = '<p>Unable to load photos.</p>';
            });

        closeButton.addEventListener('click', closeLightbox);

        lightbox.addEventListener('click', (event) => {
            if (event.target === lightbox) {
                closeLightbox();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && lightbox.classList.contains('is-open')) {
                closeLightbox();
            }
        });
    </script>
</body>
</html>
